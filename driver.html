<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24Seven | لوحة الكابتن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="images/icon-192x192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --primary: #3b82f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .font-num {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 0.65rem;
            gap: 3px;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 1.1rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Chat */
        .chat-wrap {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
        }

        .chat-msgs {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.82rem;
            line-height: 1.5;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-me {
            background: var(--primary);
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }

        .msg-other {
            background: #334155;
            color: #e2e8f0;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .msg-admin {
            background: #7c3aed25;
            color: #c4b5fd;
            border: 1px solid #7c3aed40;
            align-self: center;
            text-align: center;
            border-radius: 12px;
            font-size: 0.78rem;
        }

        .msg-system {
            background: #f59e0b15;
            color: #fbbf24;
            align-self: center;
            text-align: center;
            font-size: 0.72rem;
            border-radius: 20px;
            padding: 6px 14px;
        }

        .chat-bar {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .chat-bar input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 10px 16px;
            color: white;
            outline: none;
            font-size: 0.82rem;
            font-family: 'Cairo', sans-serif;
        }

        .chat-bar button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Trip Stage Badge */
        .stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid;
        }

        /* Finance card */
        .fin-stat {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        /* Notification Dropdown */
        .notif-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            left: auto;
            width: 280px;
            max-width: calc(100vw - 20px);
            max-height: 60vh;
            overflow-y: auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .notif-dropdown.show {
            display: block;
        }

        .notif-item {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .notif-item:hover {
            background: #334155;
        }

        .notif-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <!-- شاشة الدخول -->
    <div id="login-screen"
        class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div
            class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center font-black text-3xl text-white mb-6 shadow-xl shadow-blue-500/20">
            <i class="fas fa-steering-wheel"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-1">24Seven</h1>
        <p class="text-slate-400 mb-8 text-sm">لوحة الكابتن</p>
        <input id="driver-phone" type="tel" placeholder="رقم تليفونك"
            class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-center text-white font-num text-lg mb-4 outline-none focus:border-blue-500"
            maxlength="11">
        <button onclick="driverLogin()"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition">
            <i class="fas fa-sign-in-alt ml-2"></i> دخول
        </button>
        <p id="login-error" class="text-red-400 text-sm mt-4 hidden"></p>
    </div>

    <!-- الهيدر -->
    <header
        class="p-4 flex justify-between items-center bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800">
        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center font-black text-white text-sm">
                24</div>
            <div>
                <h1 class="text-sm font-bold leading-tight">Seven Captain</h1>
                <p id="header-driver-name" class="text-[10px] text-slate-400">كابتن</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="header-status" class="w-2 h-2 rounded-full bg-green-400"></div>

            <!-- Notifications -->
            <div class="relative z-[100]">
                <button onclick="toggleNotifications()"
                    class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition relative">
                    <i class="fas fa-bell text-xs"></i>
                    <span id="notif-badge"
                        class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full text-[8px] flex items-center justify-center text-white font-bold"
                        style="display: none;">0</span>
                </button>
                <div id="notif-dropdown" class="notif-dropdown right-auto left-0 mt-2">
                    <div
                        class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 sticky top-0 backdrop-blur-md">
                        <span class="text-xs font-bold text-white"><i
                                class="fas fa-bell text-amber-500 ml-1"></i>التنبيهات</span>
                        <button onclick="clearNotifications()" class="text-[10px] text-slate-400 hover:text-white">مسح
                            الكل</button>
                    </div>
                    <div id="notif-list" class="text-slate-300">
                        <div class="p-4 text-center text-[10px] text-slate-500">لا توجد تنبيهات جديدة</div>
                    </div>
                </div>
            </div>

            <button onclick="driverLogout()"
                class="w-8 h-8 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white transition">
                <i class="fas fa-sign-out-alt text-xs"></i>
            </button>
        </div>
    </header>

    <div class="p-4">
        <!-- صفحة الرحلات -->
        <div id="page-trips" class="page active">
            <h2 class="text-lg font-bold mb-4 text-white"><i class="fas fa-road text-blue-400 ml-2"></i>رحلاتي</h2>
            <div id="driver-trips-list" class="space-y-4 pb-4"></div>
        </div>

        <!-- صفحة المحادثات -->
        <div id="page-chats" class="page">
            <h2 class="text-lg font-bold mb-4 text-white"><i class="fas fa-comments text-blue-400 ml-2"></i>المحادثات
            </h2>
            <div id="driver-chats-list" class="space-y-3 pb-4"></div>
        </div>

        <!-- نافذة محادثة مفردة -->
        <div id="page-chat-window" class="page">
            <div class="chat-wrap">
                <div class="flex items-center gap-3 pb-3 border-b border-slate-700 mb-1">
                    <button onclick="backToChats()"
                        class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                    <div class="flex-1">
                        <p id="chat-client-name" class="font-bold text-white text-sm">العميل</p>
                        <p id="chat-trip-route" class="text-[10px] text-slate-400"></p>
                    </div>
                </div>
                <div id="chat-messages" class="chat-msgs"></div>
                <div class="chat-bar">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك..."
                        onkeypress="if(event.key==='Enter')sendDriverMessage()">
                    <button onclick="sendDriverMessage()" class="bg-blue-600 text-white"><i
                            class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- صفحة الحسابات -->
        <div id="page-finance" class="page">
            <h2 class="text-lg font-bold mb-4 text-white"><i class="fas fa-wallet text-green-400 ml-2"></i>حسابي</h2>
            <div id="finance-content">
                <div class="glass p-4 mb-4">
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="fin-stat">
                            <p class="text-[10px] text-slate-400 mb-1">إجمالي الرحلات</p>
                            <p id="fin-total-trips" class="font-bold text-white font-num text-lg">0</p>
                            <p class="text-[10px] text-slate-500">رحلة</p>
                        </div>
                        <div class="fin-stat">
                            <p class="text-[10px] text-slate-400 mb-1">النقدية المحصلة</p>
                            <p id="fin-cash" class="font-bold text-white font-num text-lg">0</p>
                            <p class="text-[10px] text-slate-500">جنيه</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="fin-stat">
                            <p class="text-[10px] text-red-400 mb-1">عمولة الشركة</p>
                            <p id="fin-commission" class="font-bold text-red-400 font-num text-lg">0</p>
                            <p class="text-[10px] text-slate-500">جنيه</p>
                        </div>
                        <div class="fin-stat">
                            <p class="text-[10px] text-amber-400 mb-1">سلف وخصومات</p>
                            <p id="fin-deductions" class="font-bold text-amber-400 font-num text-lg">0</p>
                            <p class="text-[10px] text-slate-500">جنيه</p>
                        </div>
                    </div>
                    <div class="fin-stat border border-green-500/30">
                        <p class="text-[10px] text-green-300 mb-1">🏆 الصافي للكابتن</p>
                        <p id="fin-net" class="font-bold text-green-300 font-num text-2xl">0</p>
                        <p class="text-[10px] text-slate-500">جنيه</p>
                    </div>
                </div>
                <h3 class="text-sm font-bold text-slate-300 mb-3">سجل الرحلات المنتهية</h3>
                <div id="fin-trips-list" class="space-y-3 pb-4"></div>
            </div>
        </div>
    </div>

    <!-- شريط التنقل -->
    <nav class="bottom-nav" id="main-nav">
        <div onclick="switchTab('trips')" class="nav-item active" id="nav-trips">
            <i class="fas fa-road"></i><span>رحلاتي</span>
        </div>
        <div onclick="switchTab('chats')" class="nav-item" id="nav-chats">
            <i class="fas fa-comments"></i><span>المحادثات</span>
        </div>
        <div onclick="switchTab('finance')" class="nav-item" id="nav-finance">
            <i class="fas fa-wallet"></i><span>حسابي</span>
        </div>
    </nav>

    <script>
        const sb = supabase.createClient(
            'https://wtjwzqvmwnbvjxnmweqq.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0and6cXZtd25idmp4bm13ZXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0NjU0MDMsImV4cCI6MjA4NzA0MTQwM30.kTFK22b18cc1BmvMyLTt-7V113jyf_YrodSB7Km00tY'
        );

        let currentDriver = null;
        let currentChatTripId = null;
        let chatSub = null;

        // ==========================================
        // تسجيل الدخول
        // ==========================================
        async function driverLogin() {
            const phone = document.getElementById('driver-phone').value.trim();
            if (!phone) return;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            const { data, error } = await sb.from('drivers').select('*').eq('phone', phone).single();
            if (error || !data) {
                errEl.textContent = 'رقم التليفون غير مسجل. تواصل مع الإدارة.';
                errEl.classList.remove('hidden');
                return;
            }
            currentDriver = data;
            localStorage.setItem('driver_data', JSON.stringify(data));
            showDriverApp();
        }

        function showDriverApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('header-driver-name').textContent = 'كابتن ' + currentDriver.name;
            loadDriverTrips();
            setupDriverRealtime();
            renderNotifications();
        }

        function driverLogout() {
            localStorage.removeItem('driver_data');
            currentDriver = null;
            if (chatSub) sb.removeChannel(chatSub);
            location.reload();
        }

        (function () {
            const saved = localStorage.getItem('driver_data');
            if (saved) { currentDriver = JSON.parse(saved); showDriverApp(); }
        })();

        // ==========================================
        // التنقل بين الصفحات
        // ==========================================
        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('nav-' + id)?.classList.add('active');
            document.getElementById('main-nav').style.display = 'flex';
            if (id === 'trips') loadDriverTrips();
            else if (id === 'chats') loadDriverChats();
            else if (id === 'finance') loadFinancePage();
        }

        // ==========================================
        // رحلاتي - التصميم الجديد
        // ==========================================
        async function loadDriverTrips() {
            const list = document.getElementById('driver-trips-list');
            list.innerHTML = '<p class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin ml-2"></i>جاري التحميل...</p>';

            let allCards = [];

            // === مصدر 1: رحلات من جدول trips (النظام القديم) ===
            try {
                const { data: trips } = await sb.from('trips')
                    .select('*, cars:cars!fk_trips_car(*)')
                    .eq('driver_id', currentDriver.id)
                    .in('status', ['driver_assigned', 'completed', 'trip_ended'])
                    .order('created_at', { ascending: false });

                if (trips && trips.length > 0) {
                    const userIds = trips.map(t => t.user_id).filter(Boolean);
                    let profilesMap = {};
                    if (userIds.length > 0) {
                        const { data: profiles } = await sb.from('profiles').select('id, full_name').in('id', userIds);
                        if (profiles) profiles.forEach(p => profilesMap[p.id] = p);
                    }
                    allCards.push(...trips.map(t => ({ type: 'trip', html: renderTripCard(t, profilesMap), date: t.created_at })));
                }
            } catch(e) { console.error('Error loading trips:', e); }

            // === مصدر 2: رحلات من google_reservations (الشيت) ===
            try {
                // البحث بعدة صيغ لرقم الهاتف (معالجة +20, 0020, 01, 1)
                let driverPhone = currentDriver.phone.replace(/\D/g, '');
                // إزالة مقدمة الدولة المصرية بكل أشكالها
                if (driverPhone.startsWith('0020')) driverPhone = driverPhone.substring(4);
                else if (driverPhone.startsWith('20') && driverPhone.length > 10) driverPhone = driverPhone.substring(2);
                if (driverPhone.startsWith('0') && driverPhone.length === 11) driverPhone = driverPhone.substring(1);
                // driverPhone الآن = 10 أرقام بدون أي مقدمة (مثل 1121748885)

                const phoneSuffix = driverPhone.length > 8 ? driverPhone.slice(-9) : driverPhone;
                const withZero = '0' + driverPhone; // 01121748885
                const with20 = '20' + driverPhone;  // 201121748885

                const { data: sheetTrips } = await sb.from('google_reservations')
                    .select('*')
                    .or(`modified_driver_phone.ilike.%${phoneSuffix}%,modified_driver_phone.eq.${withZero},modified_driver_phone.eq.${with20},modified_driver_phone.eq.${driverPhone}`)
                    .order('trip_date', { ascending: false })
                    .limit(30);

                if (sheetTrips && sheetTrips.length > 0) {
                    allCards.push(...sheetTrips.map(t => ({ type: 'sheet', html: renderSheetTripCard(t), date: t.trip_date || t.created_at })));
                }
            } catch(e) { console.error('Error loading sheet trips:', e); }

            if (allCards.length === 0) {
                list.innerHTML = '<div class="text-center py-16 text-slate-500"><i class="fas fa-inbox text-5xl mb-3 block opacity-30"></i><p>لا توجد رحلات حالياً</p></div>';
                return;
            }

            list.innerHTML = allCards.map(c => c.html).join('');
        }

        // عرض رحلة من google_reservations (الشيت)
        function renderSheetTripCard(t) {
            const clientName = t.customer_name || 'عميل';
            const pickup = (t.pickup_address || '').substring(0, 40);
            const dropoff = (t.dropoff_address || '').substring(0, 40);
            const tripDate = t.trip_date || '--';
            const tripTime = t.trip_time || '--';
            const price = t.cost || 0;
            const pax = t.passengers || '1';
            const bags = t.bags || '0';
            const carType = t.car_type || '--';
            const tripType = t.trip_type || '--';
            const clientPhone = 'مخفي';
            const status = t.status || 'pending';
            
            const isActive = !['completed', 'trip_ended', 'cancelled'].includes(status);
            const statusColor = isActive ? 'text-blue-400 bg-blue-500/10 border-blue-500/30' : 'text-slate-400 bg-slate-700/30 border-slate-600/30';
            const statusText = isActive ? '🟢 نشطة' : '✅ مكتملة';

            return `
            <div class="glass p-4 mb-3">
                <div class="flex items-center justify-between mb-3">
                    <span class="stage-badge ${statusColor} text-xs">${statusText}</span>
                    <span class="font-bold font-num text-blue-400 text-lg">${price} EGP</span>
                </div>

                <div class="bg-slate-800/60 rounded-xl p-3 mb-3 space-y-2">
                    <div class="flex items-start gap-2">
                        <i class="fas fa-circle-dot text-green-500 text-[10px] mt-1 flex-shrink-0"></i>
                        <p class="text-xs text-slate-200 leading-tight">${pickup}</p>
                    </div>
                    <div class="flex items-start gap-2">
                        <i class="fas fa-location-dot text-red-500 text-[10px] mt-1 flex-shrink-0"></i>
                        <p class="text-xs text-slate-200 leading-tight">${dropoff}</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-3 text-center">
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">📅 التاريخ</p><p class="text-[11px] text-white font-num">${tripDate}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">⏰ الوقت</p><p class="text-[11px] text-white font-num">${tripTime}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">🚗 النوع</p><p class="text-[11px] text-white">${carType}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">👥 أفراد / شنط</p><p class="text-[11px] text-white font-num">${pax} فرد / ${bags} شنطة</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">🔄 الاتجاه</p><p class="text-[11px] text-white">${tripType}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">💵 التكلفة</p><p class="text-[11px] text-blue-400 font-num font-bold">${price} EGP</p></div>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-slate-700/60">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600/20 border border-blue-500/30 rounded-full flex items-center justify-center text-sm">👤</div>
                        <div>
                            <p class="text-xs font-bold text-white">${clientName}</p>
                            <p class="text-[10px] text-blue-400"><i class="fas fa-comment-dots ml-1 text-[8px]"></i>التواصل عبر الدردشة فقط</p>
                        </div>
                    </div>
                    ${isActive && t.sql_server_id ? `
                    <button onclick="openDriverChat('${t.sql_server_id}', '${clientName}')"
                        class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                        <i class="fas fa-comment"></i> دردشة
                    </button>` : ''}
                </div>
            </div>`;
        }

        function renderTripCard(t, profilesMap) {
            const profile = profilesMap[t.user_id] || {};
            let clientName = profile.full_name || 'عميل';
            if (t.admin_notes && t.admin_notes.includes('حجز هاتفي')) {
                const nm = t.admin_notes.match(/العميل: (.*?)[\n(]/);
                if (nm) clientName = nm[1].trim();
            }
            if (t.manual_client_name) clientName = t.manual_client_name;

            // === قراءة البيانات من الأعمدة المباشرة أولاً، ثم fallback على admin_notes ===
            let tripType = '', payMethod = '', tripDate = '', tripTime = '', passengers = '1', bags = '0';
            
            // 1. قراءة مباشرة من أعمدة الجدول
            if (t.trip_date) tripDate = t.trip_date;
            if (t.trip_time) tripTime = t.trip_time;
            if (t.passengers) passengers = String(t.passengers);
            if (t.bags) bags = String(t.bags);
            if (t.car_type) tripType = t.car_type;
            if (t.payment_method) payMethod = t.payment_method;
            
            // 2. Fallback: استخراج من admin_notes لو الأعمدة فاضية
            const notes = t.admin_notes || '';
            if (!tripType) { 
                const typeM = notes.match(/نوع:\s*([^|\n]*)/) || notes.match(/رحلة:\s*([^|\n]*)/) || notes.match(/سيارة:\s*([^|\n]*)/); 
                if (typeM) tripType = typeM[1].trim(); 
            }
            if (!payMethod) { 
                const payM = notes.match(/الدفع:\s*([^|\n]*)/) || notes.match(/نوع التحصيل:\s*([^|\n]*)/); 
                if (payM) payMethod = payM[1].trim(); 
            }
            if (!tripDate || tripDate === '--') { 
                const dateM = notes.match(/📅\s*([0-9-/\\]+)(?:\s*[-:]\s*([0-9:amp\s]+))?/i); 
                if (dateM) { 
                    tripDate = dateM[1].trim(); 
                    if (dateM[2] && (!tripTime || tripTime === '--')) tripTime = dateM[2].trim(); 
                } else {
                    const dateM2 = notes.match(/التاريخ:\s*([^|\n]*)/); 
                    if (dateM2) tripDate = dateM2[1].trim(); 
                }
            }
            if (!tripTime || tripTime === '--') { 
                const timeM = notes.match(/الوقت:\s*([^|\n]*)/); 
                if (timeM) tripTime = timeM[1].trim(); 
            }
            if (!passengers || passengers === '--' || passengers === '1') { 
                const passM = notes.match(/👥\s*(\d+)/) || notes.match(/أفراد?:\s*(\d+)/) || notes.match(/ركاب:\s*(\d+)/) || notes.match(/(\d+)\s*(?:أفراد|فرد|ركاب)/); 
                if (passM) passengers = passM[1]; 
            }
            if (!bags || bags === '--' || bags === '0') { 
                const bagM = notes.match(/🧳\s*(\d+)/) || notes.match(/شنط?:\s*(\d+)/) || notes.match(/(\d+)\s*(?:شنط|شنطة|حقائب)/); 
                if (bagM) bags = bagM[1]; 
            }
            
            if (payMethod === 'cash') payMethod = '💵 كاش';
            else if (payMethod === 'wallet') payMethod = '💳 محفظة';
            else if (payMethod === 'postpaid') payMethod = '💳 آجل';
            else if (payMethod === 'غير محدد') payMethod = '💵 غير محدد';
            
            const tripTypeAr = tripType === 'one-way' ? 'ذهاب فقط' : tripType === 'round-diff' ? 'ذهاب وعودة' : tripType || '--';

            const isActive = t.status === 'driver_assigned';
            const statusColor = isActive ? 'text-blue-400 bg-blue-500/10 border-blue-500/30' : 'text-slate-400 bg-slate-700/30 border-slate-600/30';
            const statusText = isActive ? '🟢 نشطة' : '✅ مكتملة';

            const pickup = (t.pickup_location || '').split(',')[0];
            const dropoff = (t.dropoff_location || '').split(',')[0];

            return `
            <div class="glass p-4 mb-3">
                <!-- هيدر الكارت -->
                <div class="flex items-center justify-between mb-3">
                    <span class="stage-badge ${statusColor} text-xs">${statusText}</span>
                    <span class="font-bold font-num text-blue-400 text-lg">${t.estimated_price} EGP</span>
                </div>

                <!-- المسار -->
                <div class="bg-slate-800/60 rounded-xl p-3 mb-3 space-y-2">
                    <div class="flex items-start gap-2">
                        <i class="fas fa-circle-dot text-green-500 text-[10px] mt-1 flex-shrink-0"></i>
                        <p class="text-xs text-slate-200 leading-tight">${pickup}</p>
                    </div>
                    <div class="flex items-start gap-2">
                        <i class="fas fa-location-dot text-red-500 text-[10px] mt-1 flex-shrink-0"></i>
                        <p class="text-xs text-slate-200 leading-tight">${dropoff}</p>
                    </div>
                </div>

                <!-- البيانات -->
                <div class="grid grid-cols-3 gap-2 mb-3 text-center">
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">📅 التاريخ</p><p class="text-[11px] text-white font-num">${tripDate || '--'}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">⏰ الوقت</p><p class="text-[11px] text-white font-num">${tripTime || '--'}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">🚗 النوع</p><p class="text-[11px] text-white">${tripTypeAr}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">👥 أفراد / شنط</p><p class="text-[11px] text-white font-num">${passengers} فرد / ${bags} شنطة</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">💰 الدفع</p><p class="text-[11px] text-white">${payMethod || '--'}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2"><p class="text-[9px] text-slate-500">💵 التكلفة</p><p class="text-[11px] text-blue-400 font-num font-bold">${t.estimated_price || '--'} EGP</p></div>
                </div>

                <!-- العميل -->
                <div class="flex items-center justify-between pt-3 border-t border-slate-700/60">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600/20 border border-blue-500/30 rounded-full flex items-center justify-center text-sm">👤</div>
                        <div>
                            <p class="text-xs font-bold text-white">${clientName}</p>
                            <p class="text-[10px] text-blue-400"><i class="fas fa-comment-dots ml-1 text-[8px]"></i>التواصل عبر الدردشة فقط</p>
                        </div>
                    </div>
                    ${isActive ? `
                    <button onclick="openDriverChat('${t.id}', '${clientName}')"
                        class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                        <i class="fas fa-comment"></i> دردشة
                    </button>` : ''}
                </div>

                <!-- فلو مراحل الرحلة المتسلسل (الرحلات النشطة فقط) -->
                ${isActive ? renderStageFlow(t) : ''}
            </div>`;
        }

        // ==========================================
        // فلو الرحلة المتسلسل - كل مرحلة تظهر بعد السابقة
        // ==========================================
        function renderStageFlow(t) {
            const stage = t.stage_status || 'new';
            const tid = t.id;
            const price = t.estimated_price || 0;

            // تعريف المراحل بالترتيب
            let STAGES = [
                { key: 'garage_pickup', label: '🏭 استلام من الجراش', desc: 'صوّر السيارة قبل التحرك' },
                { key: 'heading_client', label: '🚗 التحرك للعميل', desc: 'في الطريق للعميل' },
                { key: 'arrived_client', label: '📍 وصلت للعميل', desc: 'انتظار العميل' },
                { key: 'trip_started', label: '🚀 بدء الرحلة', desc: 'الرحلة جارية' },
                { key: 'post_photos', label: '📸 تصوير السيارة (بعد)', desc: 'صوّر السيارة بعد الرحلة' },
                { key: 'financial_close', label: '💰 إقفال الحساب', desc: 'أدخل البنزين والكروت' },
                { key: 'trip_ended', label: '✅ منتهية', desc: 'تم إنهاء الرحلة' }
            ];

            // تخصيص الخطوات للكابتن الخارجي (إلغاء التصوير قبل وبعد والإقفال المالي)
            if (currentDriver && currentDriver.is_external) {
                STAGES = STAGES.filter(s => s.key !== 'garage_pickup' && s.key !== 'post_photos' && s.key !== 'financial_close');
            }

            const ORDER = STAGES.map(s => s.key);
            const currentIdx = ORDER.indexOf(stage);

            // الزرار الفعال التالي
            function stageBtn(key, label, onclick, color) {
                return `<button onclick="${onclick}" class="w-full py-3 rounded-xl text-sm font-bold border transition ${color}">${label}</button>`;
            }

            // عرض شريط التقدم
            let progressHtml = `<div class="mt-3 pt-3 border-t border-slate-700/60">`;
            progressHtml += `<p class="text-[10px] text-slate-400 font-bold mb-3">📍 فلو الرحلة</p>`;
            progressHtml += `<div class="space-y-2">`;

            STAGES.forEach((s, idx) => {
                const isDone = idx < currentIdx;
                const isCurrent = idx === currentIdx;
                const isFuture = idx > currentIdx;

                let rowClass, icon;
                if (isDone) { rowClass = 'text-green-400 opacity-70'; icon = '✅'; }
                else if (isCurrent) { rowClass = 'text-white'; icon = '▶️'; }
                else { rowClass = 'text-slate-600'; icon = '⬜'; }

                progressHtml += `<div class="flex items-center gap-2 text-xs ${rowClass}">`;
                progressHtml += `<span class="text-base">${icon}</span>`;
                progressHtml += `<span class="font-bold">${s.label}</span>`;
                if (isCurrent) progressHtml += `<span class="mr-auto text-[10px] opacity-60">${s.desc}</span>`;
                progressHtml += `</div>`;
            });

            progressHtml += `</div>`;

            // الزرار الفعال
            let actionBtn = '';
            if (stage === 'new' || currentIdx < 0) {
                if (currentDriver && currentDriver.is_external) {
                    actionBtn = stageBtn('heading_client', '🚗 تحركت - في الطريق للعميل', `tripStage('${tid}','heading_client','🚗 الكابتن في الطريق إليك، يرجى الاستعداد!')`, 'bg-blue-600 text-white hover:bg-blue-500');
                } else {
                    actionBtn = stageBtn('garage_pickup', '🏭 ابدأ: استلام السيارة من الجراش', `openCarInspection('${tid}','pre')`, 'bg-yellow-600 text-white hover:bg-yellow-500');
                }
            } else if (stage === 'garage_pickup') {
                actionBtn = stageBtn('heading_client', '🚗 تحركت - في الطريق للعميل', `tripStage('${tid}','heading_client','🚗 الكابتن في الطريق إليك، يرجى الاستعداد!')`, 'bg-blue-600 text-white hover:bg-blue-500');
            } else if (stage === 'heading_client') {
                actionBtn = stageBtn('arrived_client', '📍 وصلت لموقع العميل', `notifyArrived('${tid}')`, 'bg-green-600 text-white hover:bg-green-500');
            } else if (stage === 'arrived_client') {
                actionBtn = stageBtn('trip_started', '🚀 ركب العميل - ابدأ الرحلة', `tripStage('${tid}','trip_started','🚀 انطلقت الرحلة! نتمنى لك رحلة سعيدة.')`, 'bg-indigo-600 text-white hover:bg-indigo-500');
            } else if (stage === 'trip_started') {
                if (currentDriver && currentDriver.is_external) {
                    actionBtn = stageBtn('trip_ended', '🏁 وصلنا - إنهاء الرحلة وتأكيد الوصول', `confirmExternalEndTrip('${tid}')`, 'bg-red-600 text-white hover:bg-red-500');
                } else {
                    actionBtn = stageBtn('post_photos', '🏁 وصلنا - صوّر السيارة بعد الرحلة', `openCarInspection('${tid}','post')`, 'bg-red-600 text-white hover:bg-red-500');
                }
                actionBtn += stageBtn('dest_change', '🔀 تغيير وجهة (موافقة إدارة)', `requestDestChange('${tid}')`, 'mt-2 bg-orange-600/20 border border-orange-500/40 text-orange-400 hover:bg-orange-600 hover:text-white');
            } else if (stage === 'post_photos') {
                if (currentDriver && currentDriver.is_external) {
                    actionBtn = stageBtn('trip_ended', '🏁 إنهاء الرحلة وتأكيد الوصول', `confirmExternalEndTrip('${tid}')`, 'bg-red-600 text-white hover:bg-red-500');
                } else {
                    actionBtn = stageBtn('financial_close', '💰 إقفال الحساب (بنزين + كروت)', `openFinancialClose('${tid}',${price})`, 'bg-purple-600 text-white hover:bg-purple-500');
                }
            } else if (stage === 'financial_close' || stage === 'trip_ended') {
                actionBtn = `<div class="bg-green-600/20 border border-green-500/30 rounded-xl p-3 text-center text-green-400 text-sm font-bold">✅ الرحلة منتهية بنجاح</div>`;
            }

            progressHtml += `<div class="mt-3">${actionBtn}</div>`;

            // زرار الدردشة دايماً ظاهر
            let clientName = t.manual_client_name || 'العميل';
            progressHtml += `<button onclick="openDriverChat('${tid}', '${clientName}')" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-bold transition"><i class="fas fa-comment ml-1"></i> فتح الدردشة</button>`;
            progressHtml += `</div>`;
            return progressHtml;
        }

        // ==========================================
        // مراحل الرحلة - إرسال تحديث في الشات
        // ==========================================
        async function tripStage(tripId, stage, notifyClientMsg = null) {
            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
            try {
                const { error } = await sb.from('trips').update({ stage_status: stage }).eq('id', tripId);
                if (error) throw new Error(error.message);

                if (notifyClientMsg) {
                    await sb.from('chat_messages').insert([{
                        trip_id: tripId, sender_role: 'system', sender_id: currentDriver.id, sender_name: 'النظام',
                        message: notifyClientMsg, message_type: 'system'
                    }]);
                }
                loadDriverTrips();
            } catch (err) {
                if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
                alert('❌ خطأ: ' + err.message);
            }
        }

        // طلب تغيير الوجهة (إشعار للإدارة)
        async function requestDestChange(tripId) {
            const newDest = prompt('🔀 أدخل الوجهة الجديدة المطلوبة:');
            if (!newDest) return;
            await sb.from('chat_messages').insert([{
                trip_id: tripId, sender_role: 'driver',
                sender_id: currentDriver.id, sender_name: currentDriver.name,
                message: `⚠️ طلب تغيير وجهة:\n${newDest}\nفي انتظار موافقة الإدارة...`,
                message_type: 'system'
            }]);
            // إرسال رسالة للإدارة
            await sb.from('chat_messages').insert([{
                trip_id: tripId, sender_role: 'driver',
                sender_id: currentDriver.id, sender_name: currentDriver.name,
                message: `🚨 [طلب موافقة إدارية] الكابتن ${currentDriver.name} يطلب تغيير الوجهة إلى: ${newDest}`,
                message_type: 'admin_request'
            }]);
            alert('✅ تم إرسال طلب تغيير الوجهة للإدارة - انتظر الموافقة');
        }

        // إنهاء الرحلة مع الإقفال المالي
        async function endTripFlow(tripId, tripPrice) {
            if (!confirm('هل تريد إنهاء الرحلة وإدخال المصاريف؟')) return;
            // فتح نافذة الإقفال المالي
            openFinancialClose(tripId, tripPrice);
        }

        // نافذة الإقفال المالي
        function openFinancialClose(tripId, tripPrice) {
            const modal = document.createElement('div');
            modal.id = 'fin-close-modal';
            modal.className = 'fixed inset-0 bg-black/80 z-[200] flex items-end justify-center p-4';
            modal.innerHTML = `
            <div class="bg-slate-800 border border-slate-600 rounded-2xl p-5 w-full max-w-sm">
                <h3 class="text-white font-bold text-center mb-4 text-lg">🏁 إقفال الرحلة</h3>
                <p class="text-slate-400 text-xs text-center mb-4">أدخل مصاريف الرحلة ليتم خصمها من إجمالي الرحلة</p>
                <div class="space-y-3 mb-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">⛽ البنزين (جنيه)</label>
                        <input id="fc-fuel" type="number" min="0" value="0" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-white font-num outline-none focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">🛣️ الكروت / رسوم الطريق (جنيه)</label>
                        <input id="fc-tolls" type="number" min="0" value="0" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-white font-num outline-none focus:border-blue-500 text-sm">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="document.getElementById('fin-close-modal').remove()"
                        class="flex-1 bg-slate-700 text-white py-2.5 rounded-xl text-sm font-bold">إلغاء</button>
                    <button onclick="confirmEndTrip('${tripId}', ${tripPrice})"
                        class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-sm font-bold transition">تأكيد الإنهاء</button>
                </div>
            </div>`;
            document.body.appendChild(modal);
        }

        async function confirmEndTrip(tripId, tripPrice) {
            const fuelEl = document.getElementById('fc-fuel');
            const tollsEl = document.getElementById('fc-tolls');
            if (!fuelEl || !tollsEl) { alert('❌ خطأ: لم يتم العثور على حقول الإدخال'); return; }
            const fuel = parseFloat(fuelEl.value) || 0;
            const tolls = parseFloat(tollsEl.value) || 0;

            const btn = document.querySelector('#fin-close-modal button.bg-red-600');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...'; }

            try {
                const { error } = await sb.from('trips').update({
                    status: 'trip_ended',
                    stage_status: 'trip_ended',
                    fuel_cost: fuel,
                    toll_cost: tolls
                }).eq('id', tripId);
                if (error) throw new Error(error.message);

                await sb.from('chat_messages').insert([{
                    trip_id: tripId, sender_role: 'driver',
                    sender_id: currentDriver.id, sender_name: currentDriver.name,
                    message: `✅ تم إنهاء الرحلة!\n⛽ بنزين: ${fuel} جنيه\n🛣️ كروت: ${tolls} جنيه\nشكراً لاستخدامك 24Seven! نسعد بتقييمك.`,
                    message_type: 'trip_end'
                }]);

                sendTripEmail(tripId, '✅ رحلتك اكتملت', 'نتمنى أنك استمتعت برحلتك معنا. شكراً لاستخدامك 24Seven!');
                document.getElementById('fin-close-modal')?.remove();
                alert(`✅ تم إنهاء الرحلة!\n⛽ بنزين: ${fuel} جنيه | 🛣️ كروت: ${tolls} جنيه`);
                loadDriverTrips();
            } catch (err) {
                if (btn) { btn.disabled = false; btn.textContent = 'تأكيد الإنهاء'; }
                alert('❌ خطأ: ' + err.message);
            }
        }

        async function confirmExternalEndTrip(tripId) {
            if (!confirm('هل تريد إنهاء الرحلة وتأكيد الوصول؟')) return;
            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري إنهاء الرحلة...'; }

            try {
                const { error } = await sb.from('trips').update({
                    status: 'trip_ended',
                    stage_status: 'trip_ended',
                    fuel_cost: 0,
                    toll_cost: 0
                }).eq('id', tripId);
                if (error) throw new Error(error.message);

                await sb.from('chat_messages').insert([{
                    trip_id: tripId, sender_role: 'driver',
                    sender_id: currentDriver.id, sender_name: currentDriver.name,
                    message: `✅ تم إنهاء الرحلة بنجاح! شكراً لاستخدامك 24Seven.`,
                    message_type: 'trip_end'
                }]);

                sendTripEmail(tripId, '✅ رحلتك اكتملت', 'نتمنى أنك استمتعت برحلتك معنا. شكراً لاستخدامك 24Seven!');
                alert('✅ تم إنهاء الرحلة بنجاح');
                loadDriverTrips();
            } catch (err) {
                if (btn) { btn.disabled = false; btn.textContent = '🏁 إنهاء الرحلة وتأكيد الوصول'; }
                alert('❌ خطأ: ' + err.message);
            }
        }

        // ==========================================

        // المحادثات
        // ==========================================
        async function loadDriverChats() {
            const list = document.getElementById('driver-chats-list');
            list.innerHTML = '<p class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin ml-2"></i>جاري التحميل...</p>';

            const { data: trips } = await sb.from('trips')
                .select('*').eq('driver_id', currentDriver.id)
                .eq('status', 'driver_assigned').order('created_at', { ascending: false });

            if (!trips || trips.length === 0) {
                list.innerHTML = '<div class="text-center py-16 text-slate-500"><i class="fas fa-comment-slash text-5xl mb-3 block opacity-30"></i><p>لا توجد محادثات نشطة</p></div>';
                return;
            }

            const userIds = trips.map(t => t.user_id).filter(Boolean);
            let profilesMap = {};
            if (userIds.length > 0) {
                const { data: profiles } = await sb.from('profiles').select('id, full_name').in('id', userIds);
                if (profiles) profiles.forEach(p => profilesMap[p.id] = p);
            }

            let html = '';
            for (const t of trips) {

        async function loadChatMsgs(tripId) {
            const box = document.getElementById('chat-messages');
            const { data: msgs } = await sb.from('chat_messages').select('*').eq('trip_id', tripId).order('created_at', { ascending: true });
            box.innerHTML = '';
            if (!msgs || msgs.length === 0) {
                box.innerHTML = '<p class="text-center text-slate-500 text-xs py-8">لا توجد رسائل. ابدأ المحادثة!</p>';
                return;
            }
            msgs.forEach(m => appendMsg(m));
            box.scrollTop = box.scrollHeight;
        }

        function appendMsg(msg) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            if (msg.message_type === 'system' || msg.message_type === 'trip_end') {
                div.className = 'msg msg-system';
                div.textContent = msg.message;
            } else if (msg.sender_role === 'admin') {
                div.className = 'msg msg-admin';
                div.innerHTML = `<span class="text-[10px] block mb-1 opacity-70">🛡️ الإدارة</span>${msg.message}`;
            } else if (msg.sender_role === 'driver') {
                div.className = 'msg msg-me';
                if (msg.message_type === 'location') {
                    div.innerHTML = `📍 <a href="https://maps.google.com/?q=${msg.location_lat},${msg.location_lng}" target="_blank" class="underline">فتح الموقع</a>`;
                } else {
                    div.textContent = msg.message;
                }
            } else {
                div.className = 'msg msg-other';
                if (msg.message_type === 'location') {
                    div.innerHTML = `📍 لوكيشن العميل<br><a href="https://maps.google.com/?q=${msg.location_lat},${msg.location_lng}" target="_blank" class="underline font-bold">فتح في الخرائط</a>`;
                } else {
                    div.textContent = msg.message;
                }
            }
            const time = document.createElement('span');
            time.className = 'block text-[9px] mt-1 opacity-40';
            time.textContent = new Date(msg.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(time);
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function loadFinancePage() {
            if (!currentDriver) return;

            // جلب البيانات المالية الخاصة بالكابتن لاحتساب السلف والخصومات والعمولة
            const { data: expenses } = await sb.from('expenses').select('*').eq('related_driver_id', currentDriver.id);
            let advances = 0; let deductions = 0; let settlements = 0; let totalCommission = 0;
            if (expenses) {
                expenses.forEach(e => {
                    const amt = Number(e.amount) || 0;
                    if (e.category === 'سلفة') {
                        advances += amt;
                    } else if (e.category === 'تسوية') {
                        settlements += amt;
                    } else if (e.category === 'عمولات') {
                        totalCommission += amt; // تم الحصول عليها بناءً على إدخال الإدارة اليدوي لكل رحلة
                    } else if (e.category !== 'رواتب') {
                        deductions += amt; // خصم أو غرامة
                    }
                });
            }
            const totalDeductions = advances + deductions - settlements;

            // جلب الرحلات المنتهية للكابتن
            const { data: trips } = await sb.from('trips')
                .select('id, estimated_price, final_price, status, admin_notes, created_at, pickup_location, dropoff_location')
                .eq('driver_id', currentDriver.id)
                .in('status', ['completed', 'trip_ended'])
                .order('created_at', { ascending: false });

            const totalTrips = trips?.length || 0;
            let totalCash = 0;

            if (trips) {
                trips.forEach(t => {
                    const price = parseFloat(t.final_price) || parseFloat(t.estimated_price) || 0;
                    totalCash += price;
                });
            }

            const net = totalCash - totalCommission - totalDeductions;

            document.getElementById('fin-total-trips').textContent = totalTrips;
            document.getElementById('fin-cash').textContent = totalCash.toFixed(2);
            document.getElementById('fin-commission').textContent = totalCommission.toFixed(2);
            document.getElementById('fin-deductions').textContent = totalDeductions.toFixed(2);
            document.getElementById('fin-net').textContent = net.toFixed(2);

            // عرض قائمة الرحلات
            const finList = document.getElementById('fin-trips-list');
            if (!trips || trips.length === 0) {
                finList.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">لا توجد رحلات منتهية بعد</p>';
                return;
            }

            finList.innerHTML = trips.map(t => {
                const date = new Date(t.created_at).toLocaleDateString('ar-EG');
                const pickup = (t.pickup_location || '').split(',')[0];
                const dropoff = (t.dropoff_location || '').split(',')[0];
                return `
                <div class="glass p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] text-slate-400">${date}</span>
                        <span class="font-bold font-num text-green-400 text-sm">${t.estimated_price} EGP</span>
                    </div>
                    <div class="flex items-center gap-1 text-xs text-slate-300">
                        <i class="fas fa-circle-dot text-green-500 text-[8px]"></i>
                        <span class="truncate">${pickup}</span>
                    </div>
                    <div class="flex items-center gap-1 text-xs text-slate-300 mt-1">
                        <i class="fas fa-location-dot text-red-500 text-[8px]"></i>
                        <span class="truncate">${dropoff}</span>
                    </div>
                </div>`;
            }).join('');

                    if (profile) { clientName = profile.full_name || clientName; if (profile.email) clientEmail = profile.email; }
                }
                if (!clientEmail && trip.client_email) clientEmail = trip.client_email;
                if (trip.manual_client_name) clientName = trip.manual_client_name;
                if (!clientEmail) { const m = (trip.admin_notes || '').match(/[\w.-]+@[\w.-]+\.\w+/); if (m) clientEmail = m[0]; }

                // تجاهل الإيميلات الوهمية لمنع خطأ Address not found
                if (!clientEmail || clientEmail.includes('@24seven-client.app')) return;

                const notes = trip.admin_notes || '';
                let tripDate = '', tripTime = '';
                const dm = notes.match(/📅\s*(.*?)\s*-\s*(.*?)[\n|$]/);
                if (dm) { tripDate = dm[1].trim(); tripTime = dm[2].trim(); }

                await emailjs.send('service_kq139v5', 'template_9q7kxsc', {
                    to_email: clientEmail, client_name: clientName,
                    notification_title: notifTitle, notification_message: notifMessage,
                    trip_from: (trip.pickup_location || '').split(',')[0],
                    trip_to: (trip.dropoff_location || '').split(',')[0],

                    trip_time: tripTime || '--', trip_price: trip.estimated_price || '0',
                    captain_name: trip.drivers?.name || currentDriver?.name || 'الكابتن',
                    car_model: trip.cars?.model || '--', plate_number: trip.cars?.plate_number || '--'
                });
            } catch (err) { console.error('Email error:', err); }

        function captureInspectionPhoto(id, input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            inspectionFiles[id] = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('preview-' + id);
                preview.innerHTML = `< img src = "${e.target.result}" class="w-full h-full object-cover rounded-xl" > `;
                document.getElementById('check-' + id).textContent = '✅';
            };
            reader.readAsDataURL(file);

            // تحديث العداد
            const photos = INSPECTION_PHOTOS[currentInspectionType];
            const done = Object.keys(inspectionFiles).length;
            document.getElementById('inspect-progress').textContent = `${done} / ${photos.length} صور مكتملة`;
        }

        async function submitInspection() {
            const photos = INSPECTION_PHOTOS[currentInspectionType];
            const missing = photos.filter(p => !inspectionFiles[p.id]).map(p => p.label);

            if (missing.length > 0) {
                alert(`❌ يجب تصوير الصور التالية أولاً:\n${missing.join('\n')}`);
                return;
            }

            const btn = document.getElementById('submit-inspect-btn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري رفع الصور...';

            try {
                // ضغط الصورة - مع fallback للملف الأصلي لو فشل الضغط
                async function compressImage(file) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        const url = URL.createObjectURL(file);
                        img.onload = () => {
                            try {
                                const MAX = 900;
                                let w = img.width, h = img.height;
                                if (w > MAX || h > MAX) {
                                    if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                                    else { w = Math.round(w * MAX / h); h = MAX; }
                                }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                canvas.toBlob(blob => {
                                    URL.revokeObjectURL(url);
                                    resolve(blob || file); // fallback to original if null
                                }, 'image/jpeg', 0.70);
                            } catch (e) {
                                URL.revokeObjectURL(url);
                                resolve(file); // fallback to original file
                            }
                        };
                        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
                        img.src = url;
                    });
                }

                btn.textContent = '⏳ جاري رفع الصور...';

                // رفع الصور بشكل متوازي مع معالجة الأخطاء
                const uploadedUrls = [];
                await Promise.all(Object.entries(inspectionFiles).map(async ([id, file]) => {
                    try {
                        const compressed = await compressImage(file);
                        const path = `inspections/${currentInspectionTrip}/${currentInspectionType}/${id}_${Date.now()}.jpg`;
                        const { error } = await sb.storage.from('trip-photos').upload(path, compressed, { upsert: true, contentType: 'image/jpeg' });
                        if (error) {
                            throw new Error(`تعذر رفع الصورة ${id}: ${error.message}`);
                        }
                        const { data: urlData } = sb.storage.from('trip-photos').getPublicUrl(path);
                        if (!urlData || !urlData.publicUrl) {
                            throw new Error(`فشل الحصول على رابط الصورة ${id}`);
                        }
                        uploadedUrls.push({ id, url: urlData.publicUrl });
                    } catch (e) {
                        console.error('photo skip:', id, e);
                        throw new Error(`خطأ في رفع ${id}: ${e.message}`);
                    }
                }));

                // حفظ مرجع الصور في الداتابيز
                const fieldName = currentInspectionType + '_inspection_photos';
                await sb.from('trips').update({ [fieldName]: uploadedUrls }).eq('id', currentInspectionTrip);

                // إضافة التنبيه لمركز التنبيهات الخاص بالكابتن بدلاً من الشات
                const msg = currentInspectionType === 'pre'
                    ? '🔑 تم استلام السيارة من الجراش وتصوير حالتها. الكابتن في الطريق!'
                    : '📸 تم تصوير حالة السيارة بعد الرحلة وإرسالها للإدارة.';

                addNotification(msg);

                if (currentInspectionType === 'pre') {
                    await sb.from('trips').update({ stage_status: 'garage_pickup' }).eq('id', currentInspectionTrip);
                    // إرسال رسالة نظام للعميل أن الكابتن استلم السيارة وفي طريقه إليه ليجهز نفسه
                    await sb.from('chat_messages').insert([{
                        trip_id: currentInspectionTrip,
                        sender_role: 'system',
                        sender_id: currentDriver.id,
                        sender_name: 'النظام',
                        message: '🚗 الكابتن استلم السيارة وفي طريقه إليك، يرجى الاستعداد!',
                        message_type: 'system'
                    }]);
                } else {
                    await sb.from('trips').update({ stage_status: 'post_photos' }).eq('id', currentInspectionTrip);
                }

                document.getElementById('car-inspect-modal').remove();
                alert(`✅ تم رفع ${uploadedUrls.length} صورة بنجاح!`);
                loadDriverTrips();

            } catch (err) {
                btn.disabled = false;
                btn.textContent = '✅ تأكيد الفحص وإرسال الصور';
                alert('❌ خطأ في رفع الصور: ' + err.message);
            }
        }

        // ==========================================
        // مركز التنبيهات (Notification Center)
        // ==========================================
        function toggleNotifications() {
            document.getElementById('notif-dropdown').classList.toggle('show');
        }

        function clearNotifications() {
            localStorage.removeItem('driver_notifs_' + currentDriver?.id);
            renderNotifications();
        }

        function addNotification(msg, timeStr) {
            if (!currentDriver) return;
            const key = 'driver_notifs_' + currentDriver.id;
            let notifs = JSON.parse(localStorage.getItem(key) || '[]');
            notifs.unshift({ msg, time: timeStr || new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) });
            if (notifs.length > 20) notifs = notifs.slice(0, 20); // احتفظ بآخر 20 تنبيه
            localStorage.setItem(key, JSON.stringify(notifs));

            // تحديث الشارة (Badge)
            const badge = document.getElementById('notif-badge');
            let count = parseInt(badge.textContent || '0') + 1;
            badge.textContent = count;
            badge.style.display = 'flex';

            renderNotifications();
        }

        function renderNotifications() {
            if (!currentDriver) return;
            const key = 'driver_notifs_' + currentDriver.id;
            let notifs = JSON.parse(localStorage.getItem(key) || '[]');
            const list = document.getElementById('notif-list');

            if (notifs.length === 0) {
                list.innerHTML = '<div class="p-4 text-center text-[10px] text-slate-500">لا توجد تنبيهات جديدة</div>';
                document.getElementById('notif-badge').style.display = 'none';
                document.getElementById('notif-badge').textContent = '0';
                return;
            }

            list.innerHTML = notifs.map(n => `
            <div class="p-3 border-b border-slate-800 last:border-0 hover:bg-slate-800/50 transition">
                <p class="text-white mb-1"><i class="fas fa-car text-blue-400 ml-1"></i> ${n.msg}</p>
                <p class="text-[9px] text-slate-500 text-left" dir="ltr">${n.time}</p>
            </div>`).join('');
        }

        // إغلاق قائمة التنبيهات عند النقر خارجها
        document.addEventListener('click', function (e) {
            const dropdown = document.getElementById('notif-dropdown');
            const btn = dropdown?.previousElementSibling;
            if (dropdown && dropdown.classList.contains('show') && !dropdown.contains(e.target) && !btn.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });


        // ==========================================
        // Phase 4: تنبيه قبل الرحلة بساعة
        // ==========================================
        async function checkUpcomingTrips() {
            if (!currentDriver) return;
            const now = new Date();
            const in1hr = new Date(now.getTime() + 60 * 60 * 1000);

            const { data: trips } = await sb.from('trips')
                .select('id, admin_notes').eq('driver_id', currentDriver.id)
                .eq('status', 'driver_assigned');

            if (!trips) return;
            for (const t of trips) {
                const notes = t.admin_notes || '';
                const dm = notes.match(/📅\s*(.*?)\s*-\s*(.*?)[\n|$]/);
                if (!dm) continue;
                const tripDateTime = new Date(dm[1].trim() + ' ' + dm[2].trim());
                if (tripDateTime > now && tripDateTime <= in1hr) {
                    // تحقق أن التنبيه لم يُرسل بعد
                    const key = 'notif_sent_' + t.id;
                    if (!localStorage.getItem(key)) {
                        const msg = '⏰ تنبيه: الرحلة بعد ساعة! هل استلمت السيارة من الجراش؟ لا تنسى تصوير حالة السيارة.';
                        await sb.from('chat_messages').insert([{
                            trip_id: t.id, sender_role: 'admin',
                            sender_id: currentDriver.id, sender_name: 'النظام',
                            message: msg,
                            message_type: 'system'
                        }]);
                        addNotification(msg); // إضافة لمركز التنبيهات
                        localStorage.setItem(key, '1');
                    }
                }
            }
        }

        // فحص التنبيهات كل 5 دقائق
        setInterval(checkUpcomingTrips, 5 * 60 * 1000);

        // تسجيل Service Worker للـ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker registered', reg);
                }).catch(err => {
                    console.log('Service Worker registration failed', err);
                });
            });
        }
        let globalChatCountDriver = 0;
        let lastKnownSystemMsgId = null;
        
        // === إشعار عائم يظهر للسواق ===
        function showDriverToast(text) {
            const existing = document.getElementById('driver-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'driver-toast';
            toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,#1e40af,#7c3aed);color:white;padding:16px 24px;border-radius:16px;font-size:14px;font-weight:bold;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.4);animation:slideDown 0.4s ease;max-width:90vw;word-wrap:break-word;';
            toast.innerHTML = text;
            document.body.appendChild(toast);
            // تنبيه صوتي
            try { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(e=>{}); } catch(e) {}
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 8000);
        }

        // === نظام مزامنة شامل للسواق ===
        setInterval(async () => {
            if (typeof currentDriver === 'undefined' || !currentDriver) return;

            // 1. مراقبة الرسائل المهمة (موافقة/رفض تغيير وجهة + تحديث سعر) بغض النظر عن الصفحة المفتوحة
            try {
                const { data: sysMessages } = await sb.from('chat_messages')
                    .select('id, message, trip_id, created_at')
                    .in('message_type', ['system'])
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (sysMessages && sysMessages.length > 0) {
                    const latestMsg = sysMessages[0];
                    if (lastKnownSystemMsgId === null) {
                        lastKnownSystemMsgId = latestMsg.id;
                    } else if (latestMsg.id !== lastKnownSystemMsgId) {
                        // رسالة نظام جديدة وصلت!
                        const msg = latestMsg.message;
                        lastKnownSystemMsgId = latestMsg.id;
                        
                        // هل هي متعلقة برحلة السواق؟
                        const { data: trip } = await sb.from('trips').select('driver_id').eq('id', latestMsg.trip_id).single();
                        if (trip && trip.driver_id === currentDriver.id) {
                            // أظهر إشعار عائم
                            if (msg.includes('وافق') || msg.includes('رفض') || msg.includes('تعديل') || msg.includes('تغيير')) {
                                showDriverToast('📢 ' + msg.replace(/\\n/g, '<br>'));
                                // أعد تحميل بيانات الرحلة لتحديث السعر والوجهة
                                loadDriverTrips();
                            }
                        }
                    }
                }
            } catch(e) { console.error('Notification poll error:', e); }
            
            // 2. تحديث القائمة الجانبية في الخلفية
            if (document.getElementById('page-chats') && document.getElementById('page-chats').classList.contains('active')) {
                const { count } = await sb.from('chat_messages').select('*, trips!inner(driver_id)', { count: 'exact', head: true }).eq('trips.driver_id', currentDriver.id);
                if (count !== undefined && count > globalChatCountDriver) {
                    globalChatCountDriver = count;
                    if (typeof loadDriverChats === 'function') loadDriverChats();
                }
            }

            // 3. تحديث نافذة الشات المفتوحة
            const container = document.getElementById('chat-messages');
            if (container && container.offsetParent !== null && typeof currentChatTripId !== 'undefined' && currentChatTripId) {
                const { data: msgs } = await sb.from('chat_messages').select('id').eq('trip_id', currentChatTripId);
                const currentMsgCount = container.querySelectorAll('.msg').length;
                if (msgs && msgs.length > currentMsgCount) {
                    loadChatMsgs(currentChatTripId);
                }
            }
        }, 3000);
    </script>
