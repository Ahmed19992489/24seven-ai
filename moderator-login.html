<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24Seven | دخول الموظفين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-10 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-teal-50 rounded-full -mr-16 -mt-16 opacity-50"></div>
        
        <div class="text-center mb-8 relative">
            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-teal-100">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <h1 class="text-2xl font-black text-slate-800">دخول الموظفين</h1>
            <p class="text-slate-500 text-sm mt-1">سجل دخولك لبدء العمل والرد على العملاء</p>
        </div>

        <form id="login-form" class="space-y-5 relative">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@24seven.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-600 transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-600 transition">
            </div>
            
            <button type="submit" id="login-btn" class="w-full bg-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-teal-200 hover:bg-teal-700 hover:scale-[1.02] active:scale-95 transition-all">
                تسجيل الدخول
            </button>
        </form>

        <div id="error-msg" class="mt-4 text-center text-red-500 text-xs font-bold hidden"></div>

        <div class="mt-10 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-black">24Seven SaaS Platform v2.0</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wtjwzqvmwnbvjxnmweqq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0and6cXZtd25idmp4bm13ZXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0NjU0MDMsImV4cCI6MjA4NzA0MTQwM30.kTFK22b18cc1BmvMyLTt-7V113jyf_YrodSB7Km00tY';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawEmail = document.getElementById('email').value || '';
            const email = rawEmail.trim().toLowerCase();
            const password = (document.getElementById('password').value || '').trim();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-msg');

            btn.disabled = true;
            btn.textContent = 'جاري التحقق...';
            errorEl.classList.add('hidden');

            try {
                let loggedIn = false;
                try {
                    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                    if (!error && data?.user) {
                        const { data: profile } = await sbClient.from('profiles').select('full_name, role').eq('id', data.user.id).single();
                        if (profile) {
                            localStorage.setItem('mod_name', profile.full_name);
                            localStorage.setItem('mod_role', profile.role || 'moderator');
                            localStorage.setItem('mod_id', data.user.id);
                            loggedIn = true;
                            window.location.href = 'moderator.html';
                        }
                    }
                } catch(sbErr) {
                    console.log('Supabase Auth restricted/failed, trying server fallback...', sbErr);
                }

                if (!loggedIn) {
                    // Fallback to server authentication
                    const apiBaseUrl = window.location.origin;
                    const res = await fetch(`${apiBaseUrl}/api/mod_login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const resJson = await res.json().catch(() => ({}));
                    if (res.ok && resJson.status === 'success' && resJson.profile) {
                        localStorage.setItem('mod_name', resJson.profile.full_name);
                        localStorage.setItem('mod_role', resJson.profile.role || 'moderator');
                        localStorage.setItem('mod_id', resJson.profile.id);
                        window.location.href = 'moderator.html';
                    } else {
                        throw new Error(resJson.message || 'خطأ في اسم المستخدم أو كلمة المرور');
                    }
                }
            } catch (err) {
                errorEl.textContent = '❌ ' + err.message;
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
