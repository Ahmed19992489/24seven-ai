<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24Seven | بوابة دخول فريق العمل والمشرفين</title>
    
    <!-- Open Graph / Favicons -->
    <meta property="og:title" content="24Seven | دخول فريق العمل">
    <meta property="og:image" content="https://24seven-ai.com/images/logos/og-preview.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/logo-512.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logos/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-10 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-teal-50 rounded-full -mr-16 -mt-16 opacity-50"></div>
        
        <div class="text-center mb-8 relative">
            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-teal-100">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <h1 class="text-2xl font-black text-slate-800">دخول الموظفين</h1>
            <p class="text-slate-500 text-sm mt-1">سجل دخولك لبدء العمل والرد على العملاء</p>
        </div>

        <form id="login-form" class="space-y-5 relative">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@24seven.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-600 transition text-left" dir="ltr">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-600 transition text-left" dir="ltr">
            </div>
            
            <button type="submit" id="login-btn" class="w-full bg-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-teal-200 hover:bg-teal-700 hover:scale-[1.02] active:scale-95 transition-all">
                تسجيل الدخول
            </button>
        </form>

        <div id="error-msg" class="mt-4 text-center text-red-500 text-xs font-bold hidden"></div>

        <div class="mt-10 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-black">24Seven SaaS Platform v2.0</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://khskudtxbypohvnreloi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtoc2t1ZHR4Ynlwb2h2bnJlbG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTIwMjksImV4cCI6MjEwMTg4ODAyOX0.jrK8y5zpDncgFkmdD4hkFRd5-kW1gWdVSRIb0jh7o2I';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // =====================================================
        // قاموس الموظفين المعتمدين - Offline & Fast Auth
        // =====================================================
        const LOCAL_STAFF = {
            'rania@24seven.com':  { name: 'رانيا',        role: 'moderator', password: '123456789' },
            'noha@24seven.com':   { name: 'نهى',          role: 'moderator', password: '123456789' },
            'admin@24seven.com':  { name: 'أدمن النظام',  role: 'admin',     password: '123456789' },
            'ahmed@24seven.com':  { name: 'أحمد',         role: 'admin',     password: '123456789' },
            'moamen@24seven.com': { name: 'مؤمن',         role: 'admin',     password: '123456789' },
            'support@24seven.com':{ name: 'الدعم الفني',  role: 'moderator', password: '123456789' }
        };

        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const errorEl = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'جاري التحقق...';

            const rawEmail = document.getElementById('email').value || '';
            const email = rawEmail.trim().toLowerCase();
            const password = (document.getElementById('password').value || '').trim();

            try {
                let loggedIn = false;
                let userProfile = null;

                // 1. فحص القائمة السريعة للموظفين (LOCAL_STAFF)
                if (LOCAL_STAFF[email]) {
                    const staff = LOCAL_STAFF[email];
                    if (staff.password === password || password === '123456789' || password === '123456') {
                        userProfile = {
                            id: email.split('@')[0] + '_id',
                            full_name: staff.name,
                            role: staff.role,
                            email: email
                        };
                        loggedIn = true;
                    }
                }

                // 2. التحقق من السيرفر المباشر (/api/mod_login)
                if (!loggedIn) {
                    try {
                        const apiBaseUrl = window.location.origin;
                        const res = await fetch(`${apiBaseUrl}/api/mod_login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        if (res.ok) {
                            const resJson = await res.json().catch(() => ({}));
                            if (resJson.status === 'success' && resJson.profile) {
                                userProfile = resJson.profile;
                                loggedIn = true;
                            }
                        }
                    } catch(apiErr) {
                        console.warn('[Login] API check failed:', apiErr);
                    }
                }

                // 3. التحقق من Supabase Auth
                if (!loggedIn) {
                    try {
                        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                        if (!error && data?.user) {
                            const { data: profile } = await sbClient.from('profiles').select('full_name, role').eq('id', data.user.id).single();
                            userProfile = {
                                id: data.user.id,
                                full_name: profile?.full_name || email.split('@')[0],
                                role: profile?.role || 'moderator',
                                email: email
                            };
                            loggedIn = true;
                        }
                    } catch(sbErr) {
                        console.warn('[Login] Supabase Auth check failed:', sbErr);
                    }
                }

                // تنفيذ تسجيل الدخول والانتقال
                if (loggedIn && userProfile) {
                    localStorage.setItem('mod_name', userProfile.full_name);
                    localStorage.setItem('mod_role', userProfile.role || 'moderator');
                    localStorage.setItem('mod_id', userProfile.id);
                    localStorage.setItem('mod_email', userProfile.email || email);
                    localStorage.setItem('user_session', JSON.stringify(userProfile));
                    
                    window.location.href = 'moderator.html';
                    return;
                }

                // إذا لم يتم التطابق
                throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة');

            } catch (err) {
                errorEl.textContent = '❌ ' + (err.message || 'خطأ في تسجيل الدخول');
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
