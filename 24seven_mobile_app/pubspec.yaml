name: seven_limousine_app
description: "24Seven Limousine Mobile Application for Captains and Clients."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase integration
  supabase_flutter: ^2.6.0
  http: ^1.2.0

  # Navigation and Routing
  go_router: ^14.0.0

  # State management
  provider: ^6.1.2

  # Location & Maps (Google Maps)
  google_maps_flutter: ^2.10.1
  geolocator: ^12.0.0

  # WebView for Admin Dashboard
  webview_flutter: ^4.8.0

  # Native APIs & Utilities
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.3.3

  # UI Helper packages
  cupertino_icons: ^1.0.6
  flutter_spinkit: 5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
